[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regulens-ai"
version = "1.0.0"
description = "ReguLens AI — agentic regulatory compliance intelligence platform (deterministic by default, optional Gemini + Cerebras)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<3.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "orjson>=3.9",
    "python-dateutil>=2.8",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "ortools>=9.10",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7",
    "google-genai>=1.0",
    "cerebras-cloud-sdk>=1.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.6", "pdf2image>=1.17", "pillow>=10.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
